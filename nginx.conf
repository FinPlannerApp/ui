server {
    listen 80;
    server_name finplanner.ska97homelab.uk;

    root /var/www/financialplanner;
    index index.html;

    # Angular SPA — fallback all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker — must never be cached by the browser
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires off;
    }

    # Service worker manifest — must stay fresh
    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Web app manifest
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "public, max-age=86400";
    }

    # Cache static assets aggressively (hash-busted by Angular)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
