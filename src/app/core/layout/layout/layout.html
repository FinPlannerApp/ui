<div class="layout-wrapper min-h-screen flex flex-col relative">
  <!-- Global Top Progress Bar -->
  @if(loadingService.isLoading()) {
    <div class="fixed top-0 left-0 right-0 z-[1000]" style="padding-top: env(safe-area-inset-top, 0px);">
      <p-progressBar mode="indeterminate" [style]="{ height: '3px' }"></p-progressBar>
    </div>
  }

  <!-- Mutation feedback: a non-blocking pill + click shield BELOW dialogs/toasts (z 1500 < PrimeNG modal 2000),
       so popups opened while a save is running are never hidden behind it. -->
  @if(loadingService.isMutating()) {
    <div class="fixed inset-0 z-[1500] cursor-progress" aria-hidden="true"></div>
    <div class="fixed left-1/2 -translate-x-1/2 z-[1501] pill-saving"
         style="bottom: max(1.25rem, env(safe-area-inset-bottom, 0px));" role="status" aria-live="polite">
      <p-progressSpinner styleClass="w-4 h-4" strokeWidth="6"></p-progressSpinner>
      <span>Saving…</span>
    </div>
  }

  <!-- Header -->
  <header
    class="p-3 bg-[var(--glass-bg-solid)] backdrop-blur-xl border-b border-[var(--glass-border)] flex items-center justify-between sticky top-0 z-500"
    style="padding-top: max(0.75rem, env(safe-area-inset-top, 0px)); padding-left: max(0.75rem, env(safe-area-inset-left, 0px)); padding-right: max(0.75rem, env(safe-area-inset-right, 0px));">
    <div class="flex items-center min-w-0">
      <p-button icon="pi pi-bars" [text]="true" (onClick)="sidebarVisible = true"></p-button>
      <a routerLink="/app/dashboard" class="no-underline min-w-0 flex items-center">
        <h2 class="ml-2 my-0 gradient-text text-base sm:text-xl font-bold truncate max-w-[130px] sm:max-w-none">Financial Planner</h2>
      </a>

      <!-- Breadcrumbs & Refresh -->
      <div class="flex items-center ml-2 border-l border-[var(--glass-border)] pl-2 max-md:hidden">
        <p-breadcrumb [model]="breadcrumbService.items()"></p-breadcrumb>
        <p-button icon="pi pi-refresh" [text]="true" [rounded]="true" styleClass="ml-1"
          (onClick)="breadcrumbService.refresh()" pTooltip="Soft Reset (Refresh Data)"></p-button>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      <!-- Theme Toggle Button -->
      <p-button [icon]="themeEngine.isDark() ? 'pi pi-sun' : 'pi pi-moon'" [text]="true"
        [rounded]="true" (onClick)="themeEngine.toggleDarkMode()">
      </p-button>

      <!-- User Profile Section with Signals -->
      @if(authService.currentUser(); as userName) {
      <div class="flex items-center gap-2 sm:gap-3">
        <p-avatar [label]="userInitials()!" styleClass="bg-primary text-white cursor-pointer" shape="circle"
          (click)="op.toggle($event)"></p-avatar>

        <p-popover #op>
          <div class="flex flex-col gap-3 w-60">
            <div class="flex flex-col">
              <span class="font-bold">{{ userName }}</span>
              @if(authService.currentUserEmail(); as userEmail) {
              <span class="text-sm text-[var(--text-muted)]">{{ userEmail }}</span>
              }
            </div>
            <hr class="my-1" />
            <div class="flex flex-col gap-2 text-sm">
              <div class="flex items-center gap-2">
                <i class="pi pi-clock"></i>
                <span>Session expires in {{ authService.sessionExpiresIn() }}</span>
              </div>
            </div>
            <p-button label="Logout" icon="pi pi-sign-out" severity="danger" size="small" class="mt-2"
              (onClick)="logout()"></p-button>
          </div>
        </p-popover>
      </div>
      }
    </div>
  </header>


  <!-- Sidebar Drawer with Safe Area Bounds -->
  <p-drawer [(visible)]="sidebarVisible" [style]="{ 'max-width': '85vw', width: '320px' }">
    <ng-template pTemplate="header">
      <div class="flex items-center gap-2 px-2" style="padding-top: max(0.5rem, env(safe-area-inset-top, 0px));">
        <i class="pi pi-wallet text-xl gradient-text"></i>
        <h3 class="my-0 gradient-text">Menu</h3>
      </div>
    </ng-template>
    <ng-template pTemplate="content">
      <div class="grow overflow-y-auto">
        <p-menu [model]="navItems" styleClass="w-full"></p-menu>
      </div>
    </ng-template>
    <ng-template pTemplate="footer">
      <div class="p-3 mt-auto border-t border-[var(--glass-border)]" style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom, 0px));">
        <button type="button" (click)="sidebarVisible = false; changelog.openManually()"
          class="text-sm text-[var(--text-muted)] bg-transparent border-0 p-0 cursor-pointer hover:text-[var(--text-color)] transition-colors"
          title="See what's new">
          App {{ appVersion }} · Server {{ changelog.serverVersion() }} · What's new
        </button>
      </div>
    </ng-template>
  </p-drawer>

  <!-- Main Content Area with Dynamic Viewport Height & Safe Area Inset -->
  <div class="layout-main grow">
    <main class="p-3 md:p-5 relative z-[1] pb-[calc(1.5rem+env(safe-area-inset-bottom,0px))]">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<app-whats-new />
