<p-card [style]="{'height': '100%'}">
  <div class="flex flex-col gap-2 min-w-0">
    <div class="flex items-center justify-between min-w-0 gap-2">
      <span class="text-xs sm:text-sm font-medium text-muted-color truncate min-w-0 flex-1">{{ label() }}</span>
      <i [class]="icon()" [style]="{'color': iconColor()}" class="text-lg sm:text-xl shrink-0"></i>
    </div>
    <div class="flex items-end justify-between min-w-0 gap-2">
      <div class="min-w-0 flex-1">
        <span class="text-xl sm:text-2xl font-bold line-height-1 truncate block" [title]="value()">{{ value() }}</span>
        @if (secondaryValue()) {
          <div class="text-[11px] sm:text-xs text-muted-color mt-1 truncate" [title]="secondaryValue()">{{ secondaryValue() }}</div>
        }
      </div>
      @if (trend()) {
        <span [class]="trendClass" class="text-xs sm:text-sm font-medium shrink-0">
          {{ trend() }}
        </span>
      }
    </div>
  </div>
</p-card>
