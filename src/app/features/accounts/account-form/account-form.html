<form [formGroup]="accountForm" (ngSubmit)="onSubmit()">
  <app-form-field label="Account Name" inputId="name" [control]="accountForm.get('name')">
    <input id="name" type="text" pInputText formControlName="name" class="w-full" />
  </app-form-field>

  <app-form-field label="Starting Balance" inputId="balance" [control]="accountForm.get('balance')">
    <p-inputNumber id="balance" formControlName="balance" mode="currency" currency="INR" locale="en-IN"
      class="w-full"></p-inputNumber>
  </app-form-field>

  <app-form-field label="Category" inputId="accountCategory" [control]="accountForm.get('accountCategoryId')">
    <p-select id="accountCategory" [options]="accountCategories()" formControlName="accountCategoryId"
      optionLabel="name" optionValue="id" [showClear]="true" placeholder="Select or type to add" class="w-full"
      appendTo="body" [filter]="true" (onFilter)="filterCategories($event)">
      <ng-template pTemplate="footer">
        @if (isNewCategory()) {
        <div class="p-2 border-top-1 surface-border flex flex-column gap-2">
          <span class="text-sm text-secondary">Category type</span>
          <p-select [options]="accountTypeOptions" [ngModel]="newCategoryAccountType()" (ngModelChange)="setNewCategoryAccountType($event)" [ngModelOptions]="{standalone: true}"
            optionLabel="label" optionValue="value" appendTo="body" class="w-full"></p-select>
          <p-button label="Create '{{ currentFilter() }}'" class="p-button-link"
            (onClick)="addNewCategory()"></p-button>
        </div>
        }
      </ng-template>
    </p-select>
  </app-form-field>

  <!-- Credit Card fields -->
  @if (selectedAccountType() === AccountType.CreditCard) {
    <div class="grid">
      <div class="col-12 md:col-6">
        <app-form-field label="Credit Limit" inputId="creditLimit">
          <p-inputNumber id="creditLimit" formControlName="creditLimit" mode="currency" currency="INR" locale="en-IN" class="w-full"></p-inputNumber>
        </app-form-field>
      </div>
      <div class="col-12 md:col-6">
        <app-form-field label="Minimum Due" inputId="minimumDueAmount">
          <p-inputNumber id="minimumDueAmount" formControlName="minimumDueAmount" mode="currency" currency="INR" locale="en-IN" class="w-full"></p-inputNumber>
        </app-form-field>
      </div>
      <div class="col-12 md:col-6">
        <app-form-field label="Due Date" inputId="dueDate">
          <p-datepicker id="dueDate" formControlName="dueDate" [showIcon]="true" appendTo="body" class="w-full"></p-datepicker>
        </app-form-field>
      </div>
      <div class="col-12 md:col-6">
        <app-form-field label="Statement Closing Date" inputId="statementClosingDate">
          <p-datepicker id="statementClosingDate" formControlName="statementClosingDate" [showIcon]="true" appendTo="body" class="w-full"></p-datepicker>
        </app-form-field>
      </div>
    </div>
  }

  <!-- Loan fields -->
  @if (selectedAccountType() === AccountType.Loan) {
    <div class="grid">
      <div class="col-12 md:col-6">
        <app-form-field label="Principal Amount" inputId="principalAmount">
          <p-inputNumber id="principalAmount" formControlName="principalAmount" mode="currency" currency="INR" locale="en-IN" class="w-full"></p-inputNumber>
        </app-form-field>
      </div>
      <div class="col-12 md:col-6">
        <app-form-field label="Interest Rate (%)" inputId="loanInterestRate">
          <p-inputNumber id="loanInterestRate" formControlName="loanInterestRate" suffix="%" [minFractionDigits]="2" class="w-full"></p-inputNumber>
        </app-form-field>
      </div>
      <div class="col-12 md:col-6">
        <app-form-field label="EMI Amount" inputId="emiAmount">
          <p-inputNumber id="emiAmount" formControlName="emiAmount" mode="currency" currency="INR" locale="en-IN" class="w-full"></p-inputNumber>
        </app-form-field>
      </div>
      <div class="col-12 md:col-6">
        <app-form-field label="Tenure (months)" inputId="tenureMonths">
          <p-inputNumber id="tenureMonths" formControlName="tenureMonths" [useGrouping]="false" class="w-full"></p-inputNumber>
        </app-form-field>
      </div>
      <div class="col-12 md:col-6">
        <app-form-field label="Next EMI Due Date" inputId="nextEmiDueDate">
          <p-datepicker id="nextEmiDueDate" formControlName="nextEmiDueDate" [showIcon]="true" appendTo="body" class="w-full"></p-datepicker>
        </app-form-field>
      </div>
      <div class="col-12 md:col-6">
        <app-form-field label="Loan Start Date" inputId="loanStartDate">
          <p-datepicker id="loanStartDate" formControlName="loanStartDate" [showIcon]="true" appendTo="body" class="w-full"></p-datepicker>
        </app-form-field>
      </div>
    </div>
  }

  <!-- Bank fields -->
  @if (selectedAccountType() === AccountType.Bank) {
    <div class="grid">
      <div class="col-12 md:col-6">
        <app-form-field label="Interest Rate (%)" inputId="bankInterestRate">
          <p-inputNumber id="bankInterestRate" formControlName="bankInterestRate" suffix="%" [minFractionDigits]="2" class="w-full"></p-inputNumber>
        </app-form-field>
      </div>
      <div class="col-12 md:col-6">
        <app-form-field label="Interest Frequency" inputId="interestFrequency">
          <p-select id="interestFrequency" [options]="interestFrequencyOptions" formControlName="interestFrequency"
            optionLabel="label" optionValue="value" appendTo="body" class="w-full"></p-select>
        </app-form-field>
      </div>
    </div>
  }

  <div class="flex align-items-center justify-content-end gap-2 mt-4 pt-3 border-top-1 surface-border">
    <p-button label="Cancel" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="ref.close()"></p-button>
    <p-button [label]="isEditMode ? 'Update Account' : 'Create Account'"
      [icon]="isEditMode ? 'pi pi-check' : 'pi pi-plus'" type="submit" [loading]="isSubmitting()"
      [disabled]="accountForm.invalid"></p-button>
  </div>
</form>
