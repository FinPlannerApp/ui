<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>

@if (backLinkPath) {
<div class="mb-4">
    <a [routerLink]="backLinkPath" class="no-underline">
        <p-button [label]="backLinkLabel || ('Back to ' + singularTitle)" icon="pi pi-arrow-left"
            [text]="true"></p-button>
    </a>
</div>
}
<p-card [header]="title">
    <ng-template pTemplate="header">
        <div
            class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center w-full gap-3 p-3 border-b border-[var(--glass-border)]">
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 grow">
                @if (showCategoryFilter()) {
                <p-select [options]="categories()" [ngModel]="selectedCategoryId()"
                    (ngModelChange)="selectedCategoryId.set($event); onSearch()" optionLabel="name" optionValue="id"
                    placeholder="Filter Category" [showClear]="true" class="w-full sm:w-60 p-inputtext-sm" appendTo="body"></p-select>
                }
                <p-iconfield class="flex gap-2 items-center grow">
                    <p-inputicon class="pi pi-search"></p-inputicon>
                    <input pInputText type="text" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)"
                        (keyup.enter)="onSearch()" placeholder="Search..." class="p-inputtext-sm w-full" />
                    <p-button icon="pi pi-search" [text]="true" severity="primary" size="small" (onClick)="onSearch()"
                        pTooltip="Run Search"></p-button>
                    @if (searchTerm()) {
                    <p-button icon="pi pi-times" [text]="true" severity="secondary" size="small"
                        (onClick)="clearSearch()" pTooltip="Clear Search"></p-button>
                    }
                </p-iconfield>
            </div>
            <p-button [label]="'New ' + singularTitle" icon="pi pi-plus" (onClick)="showForm()"
                severity="primary" styleClass="w-full sm:w-auto shrink-0 justify-center"></p-button>
        </div>
    </ng-template>

    @if (ready) {
    <div class="overflow-x-auto w-full">
        <app-data-table [data]="items$ | async" [columns]="columns" [loading]="isLoading$ | async" [lazy]="true"
            [totalRecords]="crudService.totalRecords$ | async" (onLazyLoad)="onLazyLoad($event)">
            <ng-template #actions let-item>
                <div class="flex gap-2">
                    <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" (onClick)="showForm(item)"></p-button>
                    <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger"
                        (onClick)="deleteItem(item)"></p-button>
                </div>
            </ng-template>
        </app-data-table>
    </div>
    } @else {
    <div class="flex justify-center p-4">
        <p-progressSpinner></p-progressSpinner>
    </div>
    }

</p-card>
