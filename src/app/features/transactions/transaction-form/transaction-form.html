<p-toast></p-toast>
<form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="description">Description</label>
    <input id="description" type="text" pInputText formControlName="description" class="w-full" pAutoFocus
      [autofocus]="true" (blur)="onDescriptionChange()" />
  </div>

  @if (suggestedMerchantName()) {
    <div class="flex align-items-center justify-content-between p-2 border-round mb-3" style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3);">
      <span class="text-sm">Tag as <strong>{{ suggestedMerchantName() }}</strong>?</span>
      <div class="flex gap-2">
        <p-button label="Tag" size="small" (onClick)="acceptMerchantSuggestion()"></p-button>
        <p-button icon="pi pi-times" [text]="true" severity="secondary" size="small" (onClick)="dismissMerchantSuggestion()"></p-button>
      </div>
    </div>
  }

  <div class="field">
    <label for="amount">Amount</label>
    <p-inputNumber id="amount" formControlName="amount" mode="currency" currency="INR" locale="en-IN"
      class="w-full"></p-inputNumber>
  </div>

  <div class="field">
    <label for="date">Date</label>
    <p-date-picker id="date" formControlName="date" [showIcon]="true" dateFormat="mm/dd/yy" class="w-full"
      appendTo="body"></p-date-picker>
  </div>

  <div class="field">
    <label for="category">Category</label>
    <p-select id="category" [options]="categories()" formControlName="transactionCategoryId" optionLabel="name"
      optionValue="id" [showClear]="true" placeholder="Select or type to add" class="w-full" [filter]="true"
      appendTo="body" (onFilter)="filterCategories($event)" (onChange)="onCategoryChange($event)">
      <!-- Add change event -->
      <ng-template pTemplate="footer">
        @if (isNewCategory()) {
        <div class="p-2 border-top-1 surface-border">
          <p-button label="Create '{{ currentFilter() }}'" [link]="true" (onClick)="addNewCategory()"></p-button>
        </div>
        }
      </ng-template>
    </p-select>
  </div>

  <div class="field">
    <label for="merchant">Merchant (optional)</label>
    <p-select id="merchant" [options]="merchants()" formControlName="merchantId" optionLabel="name"
      optionValue="id" [showClear]="true" placeholder="Select merchant" class="w-full" [filter]="true"
      appendTo="body">
    </p-select>
  </div>

  <!-- NEW: Show "Transfer to" only if it's a transfer category -->
  @if(isTransfer()) {
  <div class="field">
    <label for="destinationAccount">Transfer to</label>
    <p-select id="destinationAccount" [options]="accounts()" formControlName="destinationAccountId" optionLabel="name"
      optionValue="id" [showClear]="true" placeholder="Select destination account" class="w-full" [filter]="true"
      appendTo="body">
    </p-select>
  </div>
  }

  <!-- NEW: Show "Type" only if it's NOT a transfer -->
  @if(!isTransfer()) {
  <div class="field">
    <label for="type">Type</label>
    <p-select id="type" [options]="transactionTypes" formControlName="type" optionLabel="label" optionValue="value"
      class="w-full" appendTo="body"></p-select>
  </div>
  }

  <!-- Footer -->
  <div class="flex align-items-center justify-content-end gap-2 mt-4 pt-3 border-top-1 surface-border">
    <p-button label="Cancel" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="ref.close()"></p-button>
    <p-button label="Save Transaction" icon="pi pi-check" type="submit" [loading]="isSubmitting()"
      [disabled]="transactionForm.invalid"></p-button>
  </div>
</form>
