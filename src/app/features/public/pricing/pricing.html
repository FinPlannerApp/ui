<div class="pub">
  <div class="pub-bg" aria-hidden="true" style="height:34rem"><div class="pub-grid-bg"></div><div class="pub-orb a"></div><div class="pub-orb b"></div></div>
  <div class="pub-wrap pub-content" style="max-width:56rem">
    <header class="pub-page-head" appReveal>
      <span class="pub-eyebrow">Pricing</span>
      <h1 class="pub-h1" style="font-size:clamp(2.2rem,5vw,3.8rem)">Simple: it’s <span class="pub-grad">free</span></h1>
      <p class="pub-lead">Everything in the app is free to use today. No card needed to sign up.</p>
    </header>
    <section class="pub-section" style="padding-block:2rem">
      <div class="pub-card-lg" appReveal style="border-color:color-mix(in srgb,var(--pub-1) 45%,var(--pub-line))">
        <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.5rem">
          <h2 class="pub-h3" style="font-size:1.4rem;margin:0">Free</h2>
          <span style="font-size:2.6rem;font-weight:800;letter-spacing:-.03em">₹0</span>
        </div>
        <ul class="pub-list" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr))">
          @for (i of included; track i) { <li><i class="pi pi-check-circle"></i><span>{{ i }}</span></li> }
        </ul>
        <div class="pub-cta-row"><a routerLink="/register" class="pub-btn pub-btn-primary">Get started free <i class="pi pi-arrow-right"></i></a></div>
      </div>
      <p appReveal style="text-align:center;color:var(--pub-mute);margin-top:1.5rem;font-size:.92rem">If paid options are ever introduced, they will be announced in the app and here before anything changes.</p>
    </section>
  </div>
</div>
