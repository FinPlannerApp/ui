<form [formGroup]="budgetForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-2 p-fluid">
    <app-form-field label="Category" inputId="transactionCategoryId"
        [control]="budgetForm.get('transactionCategoryId')">
        <p-select formControlName="transactionCategoryId" [options]="categories()" optionLabel="path" optionValue="id" [filter]="true" filterBy="path"
            placeholder="Select Category (Optional for General)" appendTo="body" id="transactionCategoryId">
        </p-select>
    </app-form-field>

    <app-form-field label="Budget Amount" inputId="amount" [control]="budgetForm.get('amount')">
        <p-inputNumber formControlName="amount" mode="currency" currency="INR" locale="en-US" placeholder="0.00"
            id="amount">
        </p-inputNumber>
    </app-form-field>

    <app-form-field label="Period" inputId="period" [control]="budgetForm.get('period')">
        <p-select formControlName="period" [options]="periods" optionLabel="label" optionValue="value" id="period">
        </p-select>
    </app-form-field>

    <app-form-field label="Start Date" inputId="startDate" [control]="budgetForm.get('startDate')">
        <p-datepicker formControlName="startDate" [showIcon]="true" appendTo="body" id="startDate">
        </p-datepicker>
    </app-form-field>

    <app-form-field label="End Date (Optional)" inputId="endDate" [control]="budgetForm.get('endDate')">
        <p-datepicker formControlName="endDate" [showIcon]="true" appendTo="body" id="endDate">
        </p-datepicker>
    </app-form-field>

    <div class="flex flex-col gap-2 p-3 rounded-xl border border-white/10">
        <label class="flex items-center justify-between gap-3 cursor-pointer">
            <span class="text-sm font-semibold">Custom alert level for this budget</span>
            <p-toggleswitch [ngModel]="customAlert()" (ngModelChange)="customAlert.set($event)" [ngModelOptions]="{standalone: true}"></p-toggleswitch>
        </label>
        @if (customAlert()) {
            <div class="flex items-center justify-between text-xs text-muted"><span>Warn me at</span><strong class="text-base">{{ alertLevel() }}%</strong></div>
            <p-slider [ngModel]="alertLevel()" (ngModelChange)="setAlertLevel($event)" [ngModelOptions]="{standalone: true}" [min]="minAlert" [max]="maxAlert" [step]="5"></p-slider>
        } @else {
            <span class="text-xs text-muted">Uses your default from Budget settings.</span>
        }
    </div>

    <div class="flex justify-end gap-2 mt-2">
        <p-button label="Cancel" icon="pi pi-times" severity="secondary" type="button" (onClick)="ref.close()"
            [disabled]="isSubmitting()"></p-button>
        <p-button label="Save Budget" icon="pi pi-check" type="submit" [disabled]="budgetForm.invalid || isSubmitting()"
            [loading]="isSubmitting()"></p-button>
    </div>
</form>
