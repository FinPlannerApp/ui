<div class="w-full flex flex-col gap-4 py-4">
  <app-module-tabs [tabs]="tabs" label="Recurring sections" />
  <div>
    <h1 class="text-2xl font-bold m-0 gradient-text">Recurring settings</h1>
    <p class="text-sm text-muted mt-1 mb-0">How far the Overview looks ahead and what it lists.</p>
  </div>
  @if (loading()) {
    <p-skeleton height="180px" borderRadius="24px"></p-skeleton>
  } @else {
    <section class="glass-card rounded-3xl p-5 border border-white/10 form-grid">
      <div class="flex flex-col gap-1.5">
        <label for="look" class="text-xs font-semibold text-main">Look ahead</label>
        <p-select inputId="look" [options]="lookOptions" optionLabel="label" optionValue="value" [ngModel]="settings().lookAheadDays"
          (ngModelChange)="patch({ lookAheadDays: $event })" appendTo="body" styleClass="w-full"></p-select>
        <span class="text-[11px] text-muted">The Overview projects what will post in this window.</span>
      </div>
      <label class="flex items-start justify-between gap-3 cursor-pointer">
        <span class="flex flex-col min-w-0">
          <span class="text-xs font-semibold text-main">Show paused items</span>
          <span class="text-[11px] text-muted">Paused items stay in the list (dimmed) but never count toward totals.</span>
        </span>
        <p-toggleswitch [ngModel]="settings().showPaused" (ngModelChange)="patch({ showPaused: $event })"></p-toggleswitch>
      </label>
      <p-button label="Save settings" icon="pi pi-check" (onClick)="save()" [loading]="saving()" styleClass="w-full"></p-button>
    </section>
  }
</div>
