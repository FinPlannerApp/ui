<p-toast></p-toast>

<div class="flex flex-col gap-6 w-full px-4 md:px-8 py-4">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div class="flex items-center gap-3 min-w-0">
      <a routerLink="/app/dashboard"
         class="no-underline text-[var(--text-muted)] hover:text-[var(--primary-color)] transition-colors p-2.5 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center shrink-0">
        <i class="pi pi-arrow-left"></i>
      </a>
      <h1 class="text-xl sm:text-2xl md:text-3xl font-extrabold m-0 gradient-text truncate">Split</h1>
    </div>
    <p-button label="New Trip / Group" icon="pi pi-plus" (onClick)="openCreateForm()"
      styleClass="rounded-xl font-bold px-4 py-2 text-xs sm:text-sm w-full sm:w-auto"></p-button>
  </div>

  @if (showCreateForm()) {
    <div class="glass-card p-4 sm:p-6 rounded-2xl flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs sm:text-sm text-[var(--text-muted)]">Trip or Group Name</label>
        <input type="text" pInputText class="w-full" placeholder="e.g. Goa Trip"
          [ngModel]="formGroupName()" (ngModelChange)="formGroupName.set($event)" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-xs sm:text-sm text-[var(--text-muted)]">Your name in this group</label>
        <input type="text" pInputText class="w-full" placeholder="How you'll appear to others"
          [ngModel]="formCreatorName()" (ngModelChange)="formCreatorName.set($event)" />
      </div>
      <div class="flex flex-col sm:flex-row justify-end gap-2">
        <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="showCreateForm.set(false)"
          styleClass="w-full sm:w-auto"></p-button>
        <p-button label="Create" (onClick)="createGroup()" styleClass="w-full sm:w-auto"></p-button>
      </div>
    </div>
  }

  @if (isLoading()) {
    <div class="flex justify-center p-8">
      <p-progressSpinner></p-progressSpinner>
    </div>
  } @else {
    <div class="grid grid-cols-12 gap-4">
      @for (group of groups(); track group.id) {
        <div class="col-span-12 sm:col-span-6 lg:col-span-4">
          <a [routerLink]="['/app/split', group.id]" class="no-underline">
            <div class="glass-card-hover p-4 sm:p-5 rounded-2xl flex flex-col gap-3 h-full cursor-pointer">
              <div class="flex items-start justify-between gap-2">
                <h3 class="text-base sm:text-lg font-bold m-0 truncate text-[var(--text-primary)]">{{ group.name }}</h3>
                <button (click)="copyShareLink(group, $event)"
                  class="shrink-0 p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors border-none cursor-pointer"
                  pTooltip="Copy share link">
                  <i class="pi pi-share-alt text-xs text-[var(--text-muted)]"></i>
                </button>
              </div>
              <div class="flex items-center gap-2 text-xs sm:text-sm text-[var(--text-muted)]">
                <i class="pi pi-users"></i>
                <span>{{ group.members.length }} {{ group.members.length === 1 ? 'person' : 'people' }}</span>
              </div>
              <div class="mt-auto pt-2 border-t border-white/5">
                <span class="text-xs text-[var(--text-muted)]">Total spend</span>
                <div class="text-lg sm:text-xl font-bold gradient-text">{{ group.totalSpend | currency:'INR' }}</div>
              </div>
            </div>
          </a>
        </div>
      } @empty {
        <div class="col-span-12">
          <app-empty-state icon="pi pi-map" title="No trips yet"
            message="Create one to start splitting expenses." actionLabel="New Trip / Group"
            (action)="openCreateForm()"></app-empty-state>
        </div>
      }
    </div>
  }
</div>
