<div class="p-4 md:p-6" style="max-width: 1200px; margin: 0 auto;">
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
      <i class="pi pi-chart-bar text-3xl text-[var(--primary-color)]"></i>
      <h1 class="m-0 text-3xl font-bold">Feedback Analytics Dashboard</h1>
    </div>
    <p-button label="Back to Issues" icon="pi pi-arrow-left" severity="secondary" [outlined]="true" routerLink="/app/issues"></p-button>
  </div>

  @if (loading()) {
    <div class="flex justify-center p-6"><p-progressSpinner></p-progressSpinner></div>
  } @else {
    <div class="grid grid-cols-12 gap-4">
      <!-- Summary Cards -->
      <div class="col-span-12 md:col-span-6 lg:col-span-3">
        <p-card styleClass="shadow-lg rounded-xl h-full border-top-3 border-blue-500">
          <div class="text-[var(--text-muted)] font-semibold uppercase text-sm mb-2">Total Issues</div>
          <div class="text-4xl font-bold text-blue-500">{{stats().totalIssues}}</div>
        </p-card>
      </div>
      <div class="col-span-12 md:col-span-6 lg:col-span-3">
        <p-card styleClass="shadow-lg rounded-xl h-full border-top-3 border-orange-500">
          <div class="text-[var(--text-muted)] font-semibold uppercase text-sm mb-2">Open Issues</div>
          <div class="text-4xl font-bold text-orange-500">{{stats().openIssues}}</div>
        </p-card>
      </div>
      <div class="col-span-12 md:col-span-6 lg:col-span-3">
        <p-card styleClass="shadow-lg rounded-xl h-full border-top-3 border-green-500">
          <div class="text-[var(--text-muted)] font-semibold uppercase text-sm mb-2">Closed Issues</div>
          <div class="text-4xl font-bold text-green-500">{{stats().closedIssues}}</div>
        </p-card>
      </div>
      <div class="col-span-12 md:col-span-6 lg:col-span-3">
        <p-card styleClass="shadow-lg rounded-xl h-full border-top-3 border-purple-500">
          <div class="text-[var(--text-muted)] font-semibold uppercase text-sm mb-2">Avg Resolve Time</div>
          <div class="text-4xl font-bold text-purple-500">{{stats().avgResolveTimeHours | number:'1.1-1'}} <span class="text-lg">hrs</span></div>
        </p-card>
      </div>

      <!-- Charts -->
      <div class="col-span-12 md:col-span-6 mt-4">
        <p-card styleClass="shadow-lg h-full">
          <h3 class="mt-0 mb-3 text-xl font-bold">Issues by Status</h3>
          <p-chart type="pie" [data]="statusChartData" [options]="chartOptions" [style]="{'width': '100%'}"></p-chart>
        </p-card>
      </div>
      <div class="col-span-12 md:col-span-6 mt-4">
        <p-card styleClass="shadow-lg h-full">
          <h3 class="mt-0 mb-3 text-xl font-bold">Issues by Type</h3>
          <p-chart type="doughnut" [data]="typeChartData" [options]="chartOptions" [style]="{'width': '100%'}"></p-chart>
        </p-card>
      </div>
    </div>
  }
</div>
